name: Windows desktop build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  build:
    name: Test and publish Windows x64 EXE
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use the exact repository SDK for CI
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Get-Content global.json -Raw | ConvertFrom-Json
          $sdk.sdk.rollForward = 'disable'
          $sdk | ConvertTo-Json -Depth 4 | Set-Content global.json -Encoding utf8

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Select four-part file version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actualSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actualSdk -ne $expectedSdk) { throw 'The repository SDK version must be used.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Use a four-part release tag, for example v1.0.0.7.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.1.$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_RUN_ATTEMPT)"
          }
          $parsed = [Version]::Parse($version)
          if (@($parsed.Major, $parsed.Minor, $parsed.Build, $parsed.Revision).Where({ $_ -gt 65535 }).Count -ne 0) {
            throw 'Each file-version component must be at most 65535.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run offline VISCA and application-core tests
        run: ./scripts/Test-Offline.ps1 -Suite All

      - name: Run headless Windows adapter tests
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'CameraControl.WinUI.Tests/CameraControl.WinUI.Tests.csproj'
          dotnet restore $project --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Windows test restore failed.' }
          $categories = @(
            'ApplicationServices', 'ConnectionEditing', 'ConfirmedPhotoServices',
            'SelectedPositionServices', 'ServicesClose', 'UserOperation', 'QaScope',
            'DeploymentAdapters', 'DeploymentStartupOptions', 'LayoutPolicy',
            'VideoAdapters', 'VideoShutdown', 'LicenseCatalog'
          )
          $filter = ($categories | ForEach-Object { "TestCategory=$_" }) -join '|'
          $arguments = @('test', $project, '--no-restore', '-c', 'Release', '-p:ThreadPoolMinThreads=8', '--filter', $filter,
            '--logger', 'trx;LogFileName=adapters.trx', '--results-directory', 'TestResults',
            '--blame-hang-timeout', '60s')
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows adapter tests failed.' }
          [xml]$trx = Get-Content TestResults/adapters.trx -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -eq 0 -or [int]$counters.executed -ne [int]$counters.total -or
              [int]$counters.passed -ne [int]$counters.total) {
            throw 'Every selected Windows adapter test must execute and pass.'
          }

      - name: Publish self-contained single EXE
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Publish-App.ps1 -Runtime win-x64 -Version $env:APP_VERSION

      - name: Prepare download files and checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = 'artifacts/github-release'
          $null = New-Item -ItemType Directory -Path $releaseDirectory -Force
          Copy-Item artifacts/win-x64/CameraControl.WinUI.exe $releaseDirectory
          $sourceArchive = "$releaseDirectory/App-Sources-$($env:APP_VERSION).zip"
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'App source archive failed.' }
          $archiveArguments = @{
            Path = @('LICENSES', 'docs/bedienung.md', 'docs/freigabestand.md')
            DestinationPath = "$releaseDirectory/Licenses-and-Instructions.zip"
          }
          Compress-Archive @archiveArguments
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source commit cannot be read.' }
          [ordered]@{
            Version = $env:APP_VERSION
            Commit = $commit
            Runtime = 'win-x64'
            Run = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
            DependencySources = 'Add the matching library source set described in LICENSES/Sources-and-replacement.md before publishing a release.'
          } | ConvertTo-Json | Set-Content "$releaseDirectory/build-info.json" -Encoding utf8
          $downloadFiles = @(Get-ChildItem $releaseDirectory -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name)
          $downloadFiles | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$releaseDirectory/SHA256SUMS.txt" -Encoding ascii
          "### Windows x64 build $($env:APP_VERSION)" >> $env:GITHUB_STEP_SUMMARY
          'Download the EXE from the Windows artifact. Native UI, camera and DPI checks remain separate.' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows download files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Windows-x64-${{ steps.version.outputs.version }}
          path: artifacts/github-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test and publish diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Windows-test-results-${{ github.run_attempt }}
          path: |
            TestResults/**
            .omo/evidence/winui3-modernisierung/T9/**/*.trx
            .omo/evidence/winui3-modernisierung/T9/**/*.json
            .omo/evidence/winui3-modernisierung/T9/**/*.log
            .omo/evidence/winui3-modernisierung/T9/**/failure.txt
            .omo/evidence/winui3-modernisierung/T3/publish-*/*.log
            .omo/evidence/winui3-modernisierung/T3/publish-*/*.json
            .omo/evidence/winui3-modernisierung/T3/publish-*/failure.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub release draft
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download verified build files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Windows-x64-${{ needs.build.outputs.version }}
          path: release

      - name: Create draft with download files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Windows 11 x64. Download and start CameraControl.WinUI.exe.

          This draft contains the EXE, app sources, license texts and SHA-256 checksums.
          Add the matching library source set and its sources-manifest.json before publication.
          The source-set contract is in LICENSES/Sources-and-replacement.md.
          CI checks offline behavior and compilation. It does not confirm physical camera operation or native UI/DPI checks.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file release-notes.md --repo "$GH_REPO" \
            CameraControl.WinUI.exe App-Sources-*.zip Licenses-and-Instructions.zip build-info.json SHA256SUMS.txt
